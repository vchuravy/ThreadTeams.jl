name: Downgrade
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  downgrade:
    # Tests with the oldest versions of the dependencies that the compat entries allow
    name: Downgrade - Julia ${{ matrix.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-downgrade-compat@v2
      - uses: julia-actions/julia-buildpkg@v1
      # Julia 1.10 cannot use the unreleased branch of OhMyThreads through `Pkg.test`, see
      # CI.yml. Remove once OhMyThreads is released.
      - uses: actions/checkout@v7
        with:
          repository: JuliaFolds2/OhMyThreads.jl
          ref: vc/team-schedulers
          path: OhMyThreads.jl
      - name: Run tests
        env:
          JULIA_NUM_THREADS: '4'
        run: |
          julia --project=test -e 'using Pkg; Pkg.develop([PackageSpec(path = "."), PackageSpec(path = "OhMyThreads.jl")])'
          julia --color=yes --check-bounds=yes --project=test test/runtests.jl
