name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.threads }} threads - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - 'min'
          - '1'
        threads:
          - '1'
          - '4'
        os:
          - ubuntu-latest
        include:
          - version: '1'
            threads: '4'
            os: macos-latest
          - version: '1'
            threads: '4'
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        if: matrix.version != 'min'
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      # The tests use the schedulers from an unreleased branch of OhMyThreads, which
      # depends on ThreadTeams 2.0. Julia 1.10 ignores the `[sources]` entry for it in
      # test/Project.toml, and its `Pkg.test` cannot merge a test dependency that itself
      # depends on the package under test, so run the tests in the test environment with
      # both packages developed instead. Remove once OhMyThreads is released.
      - uses: actions/checkout@v7
        if: matrix.version == 'min'
        with:
          repository: JuliaFolds2/OhMyThreads.jl
          ref: vc/team-schedulers
          path: OhMyThreads.jl
      - name: Run tests
        if: matrix.version == 'min'
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
        run: |
          julia --project=test -e 'using Pkg; Pkg.develop([PackageSpec(path = "."), PackageSpec(path = "OhMyThreads.jl")])'
          julia --color=yes --check-bounds=yes --project=test test/runtests.jl
  runic:
    name: Runic formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
