name: Benchmark
# Runs benchmark/benchmarks.jl for the pull request and for its base with
# AirspeedVelocity.jl, and posts the comparison as a comment on the pull request. The
# numbers from GitHub's runners are noisy and far from the ones in the documentation
# (few, shared cores); only the ratio between the two revisions means something.
on:
  pull_request_target:
    branches:
      - main
permissions:
  pull-requests: write
concurrency:
  # One group per pull request: for `pull_request_target`, `github.ref` is the base branch,
  # which would put all pull requests in one group and cancel each other's runs
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    # `pull_request_target` runs with a token that can write to pull requests, and the job
    # executes the benchmark file of the pull request: only for pull requests from people
    # with write access to the repository (others can be benchmarked locally)
    if: contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Julia 1.13.2's `Pkg.add` precompiles the packages whose version changed, by name,
      # and fails with "Unknown package: Parsers" when one of them is an indirect
      # dependency (JuliaLang/Pkg.jl#4866, fixed by #4867 for 1.13.3). AirspeedVelocity
      # adds its packages in two steps, the second of which changes `Parsers`, and then
      # runs `Pkg.precompile()` itself; turning off the precompilation inside `Pkg.add`
      # avoids the failing path. Remove once the runners' Julia 1 has the fix.
      JULIA_PKG_PRECOMPILE_AUTO: 0
    steps:
      - uses: MilesCranmer/AirspeedVelocity.jl@action-v1
        with:
          julia-version: '1'
          exeflags: '--threads=4'
          mode: 'time'
